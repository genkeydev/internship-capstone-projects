name: AlertDesk

on:
  push:
    branches: [main, "intern/**", "interns/**"]
    paths:
      - "alertdesk/**"
      - ".github/workflows/alertdesk.yml"
  pull_request:
    branches: [main, "intern/**", "interns/**"]
    paths:
      - "alertdesk/**"
      - ".github/workflows/alertdesk.yml"

defaults:
  run:
    working-directory: alertdesk

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest tests/ -v --cov=alertdesk --cov-report=term-missing

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: returntocorp/semgrep-action@v1
        with:
          config: "p/python"

  container-scan:
    runs-on: ubuntu-latest
    needs: [test]
    if: hashFiles('alertdesk/Dockerfile') != ''
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t alertdesk:ci .
        working-directory: alertdesk
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: "alertdesk:ci"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
