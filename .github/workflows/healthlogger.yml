
name: HealthLogger

on:
  push:
    branches: [main, "intern/**", "interns/**"]
    paths:
      - "healthlogger/**"
      - ".github/workflows/healthlogger.yml"

  pull_request:
    branches: [main, "intern/**", "interns/**"]
    paths:
      - "healthlogger/**"
      - ".github/workflows/healthlogger.yml"

defaults:
  run:
    working-directory: healthlogger

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - run: mvn -B test

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: returntocorp/semgrep-action@v1
        with:
          config: "p/java"
  container-scan:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Build HealthLogger image
        if: hashFiles('healthlogger/Dockerfile') != ''
        run: docker build -t healthlogger:ci .
        working-directory: healthlogger

      - name: Scan HealthLogger image
        if: hashFiles('healthlogger/Dockerfile') != ''
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "healthlogger:ci"
          severity: "CRITICAL,HIGH"
          exit-code: "1"